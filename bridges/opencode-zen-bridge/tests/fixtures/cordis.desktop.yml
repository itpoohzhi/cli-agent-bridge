- id: subagent-claude-code
  config:
    model: claude-haiku-5-5
    # 2026-10-03 (указание владельца): полные права — Claude Code не спрашивает
    # разрешений (README провайдера: bypassPermissions = «explicitly set the SDK's
    # dangerous confirmation and bypass permission checks»). Эффективно только
    # после рестарта профиля. Откат: убрать permissionMode (вернётся dontAsk).
    permissionMode: bypassPermissions
    env:
      CLAUDE_CODE_EFFORT_LEVEL: high

# 2026-10-03: Codex-сабагент — рабочий режим (песочница записи). Схема пакета
# dsh-subagent-codex: permissionMode по умолчанию `never` даёт approvals "never"
# без sandbox; `approve-for-me` → {approvalPolicy: "on-request",
# approvalsReviewer: "auto_review", sandbox: "workspace-write"}.
- id: subagent-codex
  config:
    permissionMode: approve-for-me

# 2026-10-19: провайдер ACP (cursor-agent) и инструмент subagent_cursor удалены — только 12 моделей OpenCode Go + Zen.
# 2026-10-03: веб-поиск через подписку GLM Coding Plan — remote MCP z.ai
# (web-search-prime, инструмент webSearchPrime). Ключ берётся из ~/.dsh/.env
# (loadLayeredEnv подливает его в process.env до загрузки плагинов), в конфиг
# секрет не попадает. Вызовы списывают кредиты плана (calls × multiplier).
- insert:
    - id: mcp-zai-search
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: web-search-prime
        transport: streamable-http
        url: https://api.z.ai/api/mcp/web_search_prime/mcp
        headers:
          Authorization: !!js '`Bearer ${process.env.ZAI_API_KEY}`'
        # 2026-10-06: таймаут вызова 60 с -> 30 с (24 вызова >=30 с = 35 мин за сутки).
        toolCallTimeoutMs: 30000

- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are a coding agent powered by the {{model}} model.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 118784
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
        # 2026-10-03: жёсткий предел ожидания фоновой задачи. При `wait: true`
        # `job_output` блокирует ход максимум 1 с — `maxWaitTimeoutMs` клампит и
        # явный `timeout_ms` (Math.min(args.timeout_ms ?? waitTimeoutMs, waitCap)),
        # поэтому «съесть» ход ожиданием физически нельзя. Ждать и не нужно: DSH
        # сам присылает уведомление о завершении (completionDelivery: wakeup по
        # умолчанию; незабранные завершения приходят в следующий шаг или открывают
        # ход). Строка лежит ВНУТРИ preset-standard, поэтому настройка задаётся
        # здесь, а не отдельным патчем по id.
        config:
          waitTimeoutMs: 1000
          maxWaitTimeoutMs: 1000
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          # 2026-10-11: summarizer pinned to completions — Responses route (contributor) 400s on tool_choice:none sent by compaction.
          # 2026-10-18: opencode-go/deepseek-v4.1-flash gave HTTP 429 GoUsageLimitError (weekly limit) -> summarizer moved to muse-bridge/muse-spark-1.3 (1M window, HTTP 200).
          # 2026-10-18: muse-spark-1.3 has limit=1048576/target=838860 in muse-bridge/server.py -> on a 2614-message session the pruned prompt (659958 real tokens) exceeds Meta's 460800 hard threshold (659958 >= 460800, modelError retryable). muse-wonder-1.0 has limit=400000/target=320000 (~211k real tokens < 460800) and passes 5.66 MB compaction with HTTP 200.
          # 2026-10-18 (owner directive): summarizer set to agy / gemini-3.8-flash (effort: high, 1M window; default_effort high in agy-bridge/fleet.json, HTTP 200 on :9887).
          # 2026-10-19 (owner directive): summarizer = opencode-go/deepseek-v4.1-flash (agy/muse удалены из каталога).
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
            config:
              auto: true
              thresholdRatio: 0.70
              retainRatio: 0.15
              headroomTokens: 65536
              summarizationProvider: opencode-go
              summarizationModel: deepseek-v4.1-flash
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 6000
              headChars: 3000
              tailChars: 1000
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
              backgroundMode: continuable
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable
          - id: tool-subagent-codex
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: codex
              toolName: subagent_codex
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: claude-code
              toolName: subagent_claude_code
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            disabled: true
            config:
              subagentProvider: spawn
              maxRounds: 64
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        # 2026-10-06: встроенный web_search выключен (падал 29/29 за сутки, каждый сбой =
        # лишний круг LLM). Поиск — только MCP web_search_prime (mcp-zai-search). web_fetch
        # остаётся. Строка внутри preset-standard (копия): preset-ptc/-cordis/-minimal из
        # бандла не затронуты. searchTimeoutMs при search:false не используется.
        config:
          search: false
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true

# 2026-10-03 (указание владельца): убрать дубль DeepSeek из пикера.
# `llm-deepseek` = пакет @deepseek-ai/dsh-llm-deepseek-api-key, provider id
# `deepseek-official` (ярлык «DeepSeek») — падал с «no API key, DEEPSEEK_API_KEY
# не задан». Рабочий — `llm-deepseek-account` (@deepseek-ai/dsh-llm-deepseek-account,
# provider id `deepseek-account`, ярлык «DeepSeek Account»), авторизация залогиненным
# аккаунтом. Обе строки — верхнеуровневые в композиции (проверено `dsh --dump-config`),
# поэтому патч профиля по id до них достаёт: `--patch`-проба дала `disabled: true`
# без warn-and-skip. Откат: убрать эти три строки.
- id: llm-deepseek
  disabled: true
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
