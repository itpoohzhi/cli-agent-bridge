        model: muse-spark-1.3-contributor
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: compact
    completion: completed
    usage: compact
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
    collapseTiming: completion
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
# 2026-10-03: лимиты агентов по директиве владельца (поднять субагентов и активных
# агентов до 100). maxActiveSubagents 50 -> 100, добавлен maxDepth: 3 (был дефолт 1),
# maxConcurrentJobsPerOwner 50 -> 100. Это профиль, обслуживающий живой GUI DSH
# (desktop), — правка применяется только при старте профиля.
# Откат: /tmp/cel-runs/dsh-agent-limits-100/desktop-cordis.patch.yml.bak-20261003-190627
- id: subagent
  name: "@deepseek-ai/dsh-subagent"
  config:
    maxDepth: 3
    maxActiveSubagents: 25
- id: jobs
  name: "@deepseek-ai/dsh-jobs-local"
  config:
    maxConcurrentJobsPerOwner: 16

# 2026-10-15: компактные границы проекций dsh-context (медленная загрузка истории сессий,
