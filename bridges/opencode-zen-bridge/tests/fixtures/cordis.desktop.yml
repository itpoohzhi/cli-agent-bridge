        model: gemini-3.8-flash
      - provider: cli-agent-bridge
        model: grok-4.7
      - provider: cli-agent-bridge
        model: deepseek-v4.1-flash
      # Antigravity Bridge (:9887)
      - provider: agy-bridge
        model: gemini-4-argon
      - provider: agy-bridge
        model: gemini-3.8-flash
      # Meta Muse Bridge (:9886)
