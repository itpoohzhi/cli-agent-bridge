# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# 2026-10-15: Gemini 4 Argon (Contributor) подключён НАПРЯМУЮ по нативному протоколу
# google-generative-ai: встроенный каталог `google` в @deepseek-ai/dsh-llm-pi-ai ->
# http://127.0.0.1:10830/go/v1/v1beta (model-georouter -> OpenCode Go) с OPENCODE_GO_API_KEY,
# без накладных расходов CLI-моста (model-georouter, пул route-de). Дублирующий провайдер
# `opencode-go-bridge` удалён 2026-10-16. Схема плагина плоская (provider/model/reasoningEffort).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-zen-bridge
    model: mimo-v2.6-flash-free
    reasoningEffort: high
- id: subagent-model-selection-settings
