# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# 2026-10-02: бюджет инъекции канона поднят до 262144 байт. Дефолт dsh-base — 65536.
# Бюджет ОБЩИЙ на всю цепочку (user-global + project-файлы). При превышении самый
# широкий файл (user-global канон) ОПУСКАЕТСЯ раньше, чем урезается самый конкретный;
# пропуск НЕ молчаливый — markerText ставит строку
# `Workspace instruction budget <maxBytes> bytes: omitted <пути>; truncated ...`
# ГДЕ ЖИВЁТ ЗНАЧЕНИЕ: maxBytes задаётся НЕ на верхнем уровне, а в строке
# agent-instructions ВНУТРИ пресета `preset-standard` ниже в этом же файле
# (config.plugins → maxBytes: 262144). В сессию попадает именно копия из пресета,
# поэтому эффективен только этот путь.
# Значение 262144 действует ТОЛЬКО в preset standard: в preset ptc и в preset cordis
# остаётся 65536, а в preset minimal строки agent-instructions нет вовсе.
# (Отдельная верхнеуровневая строка agent-instructions, стоявшая здесь с 2026-10-02,
# была no-op — см. пояснение ниже — и удалена.)

# 2026-10-02: ВАЖНО про этот слой.
# Патч по id адресует верхнеуровневые строки дерева профиля И строки внутри обычных
# групп (`group: true` с массивом `config[]`) — построитель карты обходит их рекурсивно.
# НО строки внутри `preset-*.config.plugins` так НЕ адресуются: пресет — не группа,
# его config это объект с ключом plugins, и рекурсия туда не заходит.
# При этом два случая различаются:
#   • id, существующий ТОЛЬКО внутри пресета (например tool-subagent-claude-code),
#     даёт "entry not found" — патч пропускается с предупреждением;
#   • id, который есть и наверху (agent-instructions — объявлен в dsh-base и выключен
#     `disabled: true` в dsh-web-app), молча ложится на выключенную верхнеуровневую
#     строку: no-op именно из-за disabled, без всякого предупреждения.
# Следствие: поднять maxBytes патчем верхнего уровня НЕЛЬЗЯ — такая строка правила бы
# лишь выключенную верхнеуровневую копию, которую сессия НЕ использует, а у пресета
# осталась бы своя копия с дефолтом 65536 (проверено `--dump-config`).
# Чтобы это реально подействовало, нужен свой preset — копия standard с правкой,
# что и сделано ниже полным переопределением `preset-standard`; см. KB
# tools/deepseek-harness-agents-wiring.md, раздел про пресеты.

# 2026-10-02: переопределение preset-standard — СВОЯ копия пресета standard
# (замороженный снимок бандла, см. предупреждение ниже). Отличия от бандла ровно три:
#   (а) `tool-subagent-codex`: disabled: true → false (включает инструмент);
#   (б) `tool-subagent-claude-code`: disabled: true → false (включает инструмент);
#   (в) `agent-instructions.maxBytes`: 65536 → 262144 (бюджет канона; верхнеуровневый
#       патч профиля до пресета не достаёт — эффективен именно этот).
# Копия пресета = замороженный снимок: при апдейте DSH сверить с новым дампом
# (dsh-web-app/presets/standard.patch.yml / `--dump-config`) и пересобрать.
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are a coding agent powered by the {{model}} model.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 118784
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: >
                You are in plan mode. Stay in plan mode until exit_plan_mode
                succeeds or the user switches the session mode. Imperative
                language to implement changes means plan the implementation, not
                execute it. A user's conversational agreement — including an
                answer confirming something you asked — approves nothing and
                does not end plan mode; fold the confirmed decision into the
                plan and submit it through exit_plan_mode.


                Explore first. Use non-mutating reads, searches, static
                analysis, and checks to ground the plan in the actual
                repository. Do not edit or write files, change configuration,
                run formatters or code generation that rewrites tracked files,
                commit, or otherwise carry out the plan. Prefer existing
                functions and patterns over new machinery.


                The tool catalog stays the same across modes for request-cache
                stability. These plan-mode rules override any later tool
                description or guidance that suggests using mutation tools;
                those tools remain listed to keep the tool catalog unchanged. Do
                not use todo_write to track this planning phase: it tracks
                implementation after an approved plan, while the plan itself
                belongs in exit_plan_mode.


                Resolve discoverable facts by inspection. Use ask_user_question
                only for user-owned choices or material ambiguity that
                inspection cannot answer. Do not ask the user where code lives
                or how current behavior works when you can find out.


                Make the plan decision-complete: state the goal and success
                criteria; group implementation changes by subsystem; identify
                public API, schema, and data-flow changes; cover edge cases,
                failure modes, tests, acceptance criteria, and explicit
                assumptions. Keep it concise enough to review but detailed
                enough that another engineer can implement it without making
                design decisions.


                When ready, call exit_plan_mode with the complete plan markdown,
                starting with a # title. Make exit_plan_mode the only and final
                tool call in that assistant response: it presents the plan for
                approval, and implementation begins only in a later step after
                approval. Do not paste the final plan as a plain reply or ask
                "should I proceed?" through prose or ask_user_question. If
                review rejects it, incorporate the feedback and present again.
                If the review channel is unavailable or aborted, stay in plan
                mode and ask the user to switch modes manually; do not proceed
                with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          # 2026-10-18: opencode-go/deepseek-v4.1-flash gave HTTP 429 GoUsageLimitError (weekly limit) -> summarizer on muse-bridge/muse-spark-1.3 (1M window, HTTP 200).
          # 2026-10-18: muse-spark-1.3 has limit=1048576/target=838860 in muse-bridge/server.py -> on a 2614-message session the pruned prompt (659958 real tokens) exceeds Meta's 460800 hard threshold (659958 >= 460800, modelError retryable). muse-wonder-1.0 has limit=400000/target=320000 (~211k real tokens < 460800) and passes 5.66 MB compaction with HTTP 200.
          # 2026-10-18 (owner directive): summarizer set to agy / gemini-3.8-flash (effort: high, 1M window; default_effort high in agy-bridge/fleet.json, HTTP 200 on :9887).
          # 2026-10-19 (owner directive): summarizer = opencode-go/deepseek-v4.1-flash (agy/muse удалены из каталога).
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
            config:
              auto: true
              thresholdRatio: 0.70
              retainRatio: 0.15
              headroomTokens: 65536
              summarizationProvider: opencode-go
              summarizationModel: deepseek-v4.1-flash
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 6000
              headChars: 3000
              tailChars: 1000
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
              backgroundMode: continuable
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable
          - id: tool-subagent-codex
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: codex
              toolName: subagent_codex
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: claude-code
              toolName: subagent_claude_code
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            disabled: true
            config:
              subagentProvider: spawn
              maxRounds: 64
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true

# 2026-10-03: лимиты хостового плагина субагентов подняты до 100 активных и
# глубины 3. Что делают настройки:
#   1) maxActiveSubagents — сколько субагентов могут работать ОДНОВРЕМЕННО;
#      старый дефолт 8, новый 100 (схема: min 1, max Number.MAX_SAFE_INTEGER);
#   2) maxDepth — максимальная глубина вложенности цепочки субагентов;
#      старый дефолт 1, новый 3 (схема: min 0, max Number.MAX_SAFE_INTEGER).
# Схема обеих настроек живёт в @deepseek-ai/dsh-subagent (zod .default(8) и
# .default(1) соответственно).
# Адресация: строка `- id: subagent` (name @deepseek-ai/dsh-subagent) — ВЕРХНЕУРОВНЕВАЯ
# строка дерева профиля, приходящая из бандла @deepseek-ai/dsh-base, а не строка
# внутри preset-*.config.plugins, поэтому патч по id её достаёт.
# Важно: tool-subagent-codex и tool-subagent-claude-code оставляют у себя
# maxDepth: provider-managed — это значение перекрывает данный дефолт для них.
# Применяется ТОЛЬКО при старте профиля (нужен рестарт хоста).
# Откат: /tmp/cel-runs/dsh-agent-limits-100/cordis.patch.yml.bak-20261003-190519
- id: subagent
  config:
    maxActiveSubagents: 100
    maxDepth: 3
