# Alibaba DashScope International failover-слот 2/4 строго через model-georouter :10830/sg-qwen (route-sg).
manifest_version: 1
provider_id: dashscope-intl-k2
kind: passthrough
enabled: true
required: false
priority: 11
routing: {weight: 0}
owned_by: dashscope-intl
failover: {statuses: [401, 402, 403, 429, 503], error_types: [permission_error, credit_exhausted, payment_required, rate_limit_error, authentication_error], message_markers: [credit, quota, payment, insufficient, 'rate limit', Arrearage], pool: dashscope-intl, pool_label: 'Alibaba DashScope (SG)'}
transport:
  bridge: {base_url: 'http://127.0.0.1:10830/sg-qwen'}
  direct:
    type: http
    http:
      base_url: http://127.0.0.1:10830/sg-qwen
      path: /chat/completions
      api_key_ref:
        fallback_file: ~/.config/opencode/dashscope-intl-k2.key
      stream: true
      response: {field: 'choices[0].message.content'}
allow_base_url:
- {scheme: http, host: 127.0.0.1, port: 10830, path_prefix: /sg-qwen}
limits: {max_concurrent: 4, quota_group: dashscope-intl-k2, timeout_s: 300}
discovery:
  method: static
  static: [qwen4-max, kimi-k3.1-pro]
family_rule:
  type: exact_map
  exact_map:
    qwen4-max: Alibaba
    kimi-k3.1-pro: Moonshot
models_overrides:
  qwen4-max:
    name: Qwen4 Max (DashScope SG k2)
    efforts: ['off', low, high, xhigh]
    default_effort: high
    context_window: 984000
    max_tokens: 65536
    input: [text]
    images: {cli_registry: implicit_supported, status: unverified, method: null, proof: null}
  kimi-k3.1-pro:
    name: Kimi K3.1 Pro (DashScope SG k2)
    efforts: ['off', low, medium, high, xhigh]
    default_effort: high
    context_window: 1000000
    max_tokens: 65536
    input: [text]
    images: {cli_registry: implicit_supported, status: unverified, method: null, proof: null}
params:
  effort_field: reasoning_effort
  effort_map:
    'off':
      reasoning_effort: none
  adaptive_whitelist: [reasoning_effort, temperature, top_p]
