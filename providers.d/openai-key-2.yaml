# OpenAI через локальный геороутер: слот 2, значение ключа только из окружения.
manifest_version: 1
provider_id: openai-key-2
kind: passthrough
enabled: true
required: false
priority: 20
routing: {weight: 50}
owned_by: openai-direct
transport:
  bridge: {base_url: 'http://127.0.0.1:10830/sg-openai', api_key_env: OPENAI_API_KEY_2}
allow_base_url:
- {scheme: http, host: 127.0.0.1, port: 10830, path_prefix: /sg-openai}
# Консервативный лимит до подтверждения квот; настраивается этим манифестом.
limits: {max_concurrent: 1, quota_group: openai-key-2, timeout_s: 180}
discovery:
  method: static
  static: [gpt-6.1-sol, gpt-6.1-terra]
family_rule:
  type: exact_map
  exact_map: {gpt-6.1-sol: OpenAI, gpt-6.1-terra: OpenAI}
models_overrides:
  gpt-6.1-sol:
    name: GPT-6.1 Sol (OpenAI key 2)
    efforts: [low, medium, high, max]
    default_effort: high
    context_window: 272000
    max_tokens: 128000
    input: [text]
    images: {cli_registry: implicit_supported, status: unverified, method: null, proof: null}
  gpt-6.1-terra:
    name: GPT-6.1 Terra (OpenAI key 2)
    efforts: [low, medium, high]
    default_effort: high
    context_window: 500000
    max_tokens: 128000
    input: [text]
    images: {cli_registry: implicit_supported, status: unverified, method: null, proof: null}
params:
  effort_field: reasoning_effort
  adaptive_whitelist: [reasoning_effort, thinking, temperature, top_p]
