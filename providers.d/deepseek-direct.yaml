# DeepSeek через локальный геороутер; значение ключа только из окружения.
manifest_version: 1
provider_id: deepseek-direct
kind: passthrough
enabled: false
required: false
priority: 20
# Резерв для deepseek-v4.1-flash: основные маршруты — neuralwatt (weight 60) и единый opencode-go (weight 40).
routing: {weight: 0}
owned_by: deepseek
transport:
  bridge: {base_url: 'http://127.0.0.1:10830/sg-deepseek', api_key_env: DEEPSEEK_API_KEY}
allow_base_url:
- {scheme: http, host: 127.0.0.1, port: 10830, path_prefix: /sg-deepseek}
# Консервативный лимит до подтверждения квоты; настраивается этим манифестом.
limits: {max_concurrent: 1, quota_group: deepseek-direct, timeout_s: 180}
discovery:
  method: static
  static: [deepseek-v4.1-flash]
family_rule:
  type: exact_map
  exact_map: {deepseek-v4.1-flash: DeepSeek}
models_overrides:
  deepseek-v4.1-flash:
    name: DeepSeek V4.1 Flash (direct)
    efforts: ['off', low, high, max]
    default_effort: 'off'
    context_window: 1000000
    max_tokens: 384000
    input: [text]
    images: {cli_registry: explicit_supported, status: unverified, method: null, proof: null}
params:
  effort_field: none
  effort_map:
    'off':
      thinking: {type: disabled}
  adaptive_whitelist: [thinking]
