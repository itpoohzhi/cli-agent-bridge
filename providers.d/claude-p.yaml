# Провайдер claude-p: мост claude -p (Anthropic), passthrough к :9881. Файл claude-p.yaml: provider_id = ключ backends.claude-p в fleet.json.
manifest_version: 1
provider_id: claude-p
kind: passthrough
enabled: true
required: false
priority: 10
owned_by: claude-p-bridge
transport:
  bridge: {base_url: 'http://127.0.0.1:9881/v1', api_key_env: CLAUDE_P_BRIDGE_KEY}
allow_base_url:
- {scheme: http, host: 127.0.0.1, port: 9881, path_prefix: /v1}
limits: {max_concurrent: 128, quota_group: anthropic-claude, timeout_s: 180}
discovery:
  method: http
  http: {path: /models, id_field: 'data[].id'}
  include: [claude-*]
  exclude: ['*-free']
  refresh_interval_s: 900
family_rule: {type: owned_by, owned_by: Anthropic}
models_overrides:
  claude-sonnet-5-5:
    name: Claude Sonnet 5.5 (Claude-p bridge)
    efforts: [low, medium, high, max]
    default_effort: high
    context_window: 1000000
    max_tokens: 128000
    input: [text]
    images: {cli_registry: implicit_supported, status: unverified, method: null, proof: null}
  claude-opus-5-5:
    name: Claude Opus 5.5 (Claude-p bridge)
    efforts: [low, medium, high]
    default_effort: high
    context_window: 1000000
    max_tokens: 128000
    input: [text]
    images: {cli_registry: implicit_supported, status: unverified, method: null, proof: null}
  claude-haiku-5-5:
    name: Claude Haiku 5.5 (Claude-p bridge)
    efforts: [low, medium, high]
    default_effort: low
    context_window: 1000000
    max_tokens: 128000
    input: [text]
    images: {cli_registry: implicit_supported, status: unverified, method: null, proof: null}
params:
  effort_field: none
  adaptive_whitelist: [thinking, temperature, top_p]
