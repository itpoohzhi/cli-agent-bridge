# Провайдер claude-p: Claude Code CLI в resident stdio пуле.
manifest_version: 1
provider_id: claude-p
kind: stdio_resident
enabled: true
required: false
priority: 10
routing: {weight: 0}
owned_by: claude-p-bridge
transport:
  bridge:
    wrapper: 'claude --print --input-format stream-json --output-format stream-json --verbose'
limits: {max_concurrent: 10, quota_group: anthropic-claude, timeout_s: 180}
discovery:
  method: static
  static: [claude-sonnet-5-5, claude-opus-5-5, claude-haiku-5-5]
family_rule: {type: owned_by, owned_by: Anthropic}
models_overrides:
  claude-sonnet-5-5:
    name: Claude Sonnet 5.5 (Claude-p bridge)
    efforts: [low, medium, high, max]
    default_effort: high
    context_window: 1000000
    max_tokens: 128000
    input: [text]
    images: {cli_registry: implicit_supported, status: unverified, method: null, proof: null}
  claude-opus-5-5:
    name: Claude Opus 5.5 (Claude-p bridge)
    efforts: [low, medium, high]
    default_effort: high
    context_window: 1000000
    max_tokens: 128000
    input: [text]
    images: {cli_registry: implicit_supported, status: unverified, method: null, proof: null}
  claude-haiku-5-5:
    name: Claude Haiku 5.5 (Claude-p bridge)
    efforts: [low, medium, high]
    default_effort: low
    context_window: 1000000
    max_tokens: 128000
    input: [text]
    images: {cli_registry: implicit_supported, status: unverified, method: null, proof: null}
params:
  effort_field: none
  adaptive_whitelist: [thinking, temperature, top_p]
