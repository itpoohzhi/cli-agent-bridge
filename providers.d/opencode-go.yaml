# Провайдер opencode-go: только transport.direct (локальный шлюз :10830/go, deepseek-v4.1-flash). transport.bridge нет — в fleet.json не компилируется, только в сайдкар.
manifest_version: 1
provider_id: opencode-go
kind: passthrough
enabled: true
required: false
owned_by: opencode-go
transport:
  direct:
    type: http
    http:
      base_url: http://127.0.0.1:10830/go/v1
      path: /chat/completions
      api_key_ref:
        file_from_json: {path: ~/.config/opencode/opencode.json, key: provider.opencode-go.options.apiKey, unwrap_file_ref: true}
        fallback_file: ~/.config/opencode/opencode-go.key
      headers_from_json:
        path: ~/.config/opencode/opencode.json
        key: provider.opencode-go.options.headers
        required: [x-opencode-org-id]
        forbid_ua_prefix: [python]
      per_request_headers: {x-opencode-session: '{uuid4}'}
      stream: false
      response: {field: 'choices[0].message.content'}
allow_base_url:
- {scheme: http, host: 127.0.0.1, port: 10830, path_prefix: /go}
limits: {max_concurrent: 1, quota_group: opencode-go, timeout_s: 180}
discovery:
  method: static
  static: [deepseek-v4.1-flash]
family_rule:
  type: exact_map
  exact_map: {deepseek-v4.1-flash: DeepSeek}
models_overrides:
  deepseek-v4.1-flash:
    name: DeepSeek V4.1 Flash (OpenCode Go, direct)
    efforts: [high, max]
    default_effort: high
    context_window: 1000000
    max_tokens: 384000
    input: [text]
    images: {cli_registry: explicit_supported, status: unverified, method: null, proof: null}
    policy_lines: [106, 394, 432]
params:
  effort_field: none
  effort_map:
    'off':
      thinking: {type: disabled}
  adaptive_whitelist: [thinking]
