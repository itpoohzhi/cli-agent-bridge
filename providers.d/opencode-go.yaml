# Провайдер opencode-go: единственная активная подписка OpenCode Go через :10830/go (deepseek-v4.1-flash, kind passthrough).
# Единая точка правды для ключа — текущий активный аккаунт OpenCode Go (~/.config/opencode/opencode-go.key через opencode.json).
manifest_version: 1
provider_id: opencode-go
kind: passthrough
enabled: true
required: false
priority: 10
routing: {weight: 0}
owned_by: opencode-go
failover: {statuses: [402, 403], error_types: [permission_error, credit_exhausted, payment_required], message_markers: [credit, subscription, 'usage limit', 'go usage', payment], pool: opencode-go, pool_label: 'OpenCode Go'}
transport:
  bridge: {base_url: 'http://127.0.0.1:10830/go/v1'}
  direct:
    type: http
    http:
      base_url: http://127.0.0.1:10830/go/v1
      path: /chat/completions
      api_key_ref:
        file_from_json: {path: ~/.config/opencode/opencode.json, key: provider.opencode-go.options.apiKey, unwrap_file_ref: true}
        fallback_file: ~/.config/opencode/opencode-go.key
      headers_from_json:
        path: ~/.config/opencode/opencode.json
        key: provider.opencode-go.options.headers
        required: []
        pick: [User-Agent]
        forbid_ua_prefix: [python]
      per_request_headers: {x-opencode-session: '{session_affinity}'}
      # Поле stream не компилируется в fleet.json; клиент управляет stream в теле запроса.
      stream: true
      response: {field: 'choices[0].message.content'}
allow_base_url:
- {scheme: http, host: 127.0.0.1, port: 10830, path_prefix: /go/v1}
limits: {max_concurrent: 64, quota_group: opencode-go, timeout_s: 180}
discovery:
  method: static
  static: [deepseek-v4.1-flash]
family_rule:
  type: exact_map
  exact_map: {deepseek-v4.1-flash: DeepSeek}
models_overrides:
  deepseek-v4.1-flash:
    name: DeepSeek V4.1 Flash (OpenCode Go bridge)
    efforts: ['off', low, high, max]
    default_effort: high
    context_window: 1000000
    max_tokens: 384000
    input: [text]
    images: {cli_registry: explicit_supported, status: unverified, method: null, proof: null}
    policy_lines: [106, 394, 432]
params:
  effort_field: none
  effort_map:
    'off':
      thinking: {type: disabled}
  adaptive_whitelist: [thinking]
