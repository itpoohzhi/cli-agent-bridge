# Провайдер codex: codex app-server (OpenAI GPT) в resident stdio пуле.
manifest_version: 1
provider_id: codex
kind: stdio_resident
enabled: true
required: false
priority: 10
routing: {weight: 0}
owned_by: openai-codex
transport:
  bridge:
    wrapper: 'codex app-server'
limits: {max_concurrent: 10, quota_group: openai-codex, timeout_s: 180}
discovery:
  method: static
  static: [gpt-6.1-sol, gpt-6.1-terra]
family_rule:
  type: prefix
  prefix:
    verified: true
    map: {gpt-: OpenAI}
models_overrides:
  gpt-6.1-sol:
    name: GPT-6.1 Sol (Codex resident)
    efforts: [low, medium, high, xhigh, max]
    default_effort: high
    context_window: 272000
    max_tokens: 128000
    input: [text]
    images: {cli_registry: implicit_supported, status: unverified, method: null, proof: null}
  gpt-6.1-terra:
    name: GPT-6.1 Terra (Codex resident)
    efforts: [low, medium, high]
    default_effort: high
    context_window: 500000
    max_tokens: 128000
    input: [text]
    images: {cli_registry: implicit_supported, status: unverified, method: null, proof: null}
params:
  effort_field: reasoning_effort
  adaptive_whitelist: [reasoning_effort, thinking, temperature, top_p]
