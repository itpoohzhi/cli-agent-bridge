# Провайдер droid: legacy Factory Droid, выключен (enabled: false, как в fleet.json).
manifest_version: 1
provider_id: droid
kind: droid
enabled: false
required: false
owned_by: factory-droid
transport:
  bridge: {}
limits: {max_concurrent: 4, quota_group: factory-droid, timeout_s: 180}
discovery: {method: static}
family_rule:
  type: exact_map
  exact_map: {}
models_overrides:
  deepseek-v4.1-flash:
    name: DeepSeek V4.1 Flash (Droid legacy, неактивна)
    efforts: [high, max]
    default_effort: high
    context_window: 1000000
    max_tokens: 384000
    input: [text]
    images: {cli_registry: explicit_supported, status: unverified, method: null, proof: null}
    policy_lines: [106, 394, 432]
